  cors:
    access_control_allow_headers:
    - Authorization
    - X-WP-Nonce
    - Content-Disposition
    - Content-MD5
    - Content-Type
    access_control_expose_headers:
    - X-WP-Total
    - X-WP-TotalPages
    - Link
    note: >-
      The Authorization and X-WP-Nonce entries in Access-Control-Allow-Headers are WordPress core
      defaults advertising the two supported credential mechanisms; they are not evidence of a
      credential a third party can obtain.
