summary:
  types: []
  api_key_in: []
  oauth2_flows: []
  anonymous_read: true
  note: >-
    Neither the derived OpenAPI nor the live route-discovery documents declare any security scheme,
    because the read surface catalogued in this repo requires none. The entire wp/v2 content read
    surface on both hosts — posts, pages, media, categories, tags, comments, search and the
    type/taxonomy/status discovery documents — is served anonymously over HTTPS with no credential
    of any kind. `derive-authentication.py` therefore produced no schemes for this provider; that is
    a true result, not a gap.
model: no-auth-read / gated-write
posture: >-
  Allotera runs stock WordPress core authentication. There is no developer program, no API key
  issuance, no OAuth authorization server (/.well-known/oauth-authorization-server returns 404 on
  alloteratx.com and a soft 404 on wugen.com), and no published authentication documentation of the
  company's own. Write access and the privileged read routes fall back to WordPress's built-in
  mechanisms — cookie authentication plus an X-WP-Nonce header for same-origin browser sessions, and
  HTTP Basic with an Application Password for external clients — neither of which is available to a
  third party without an account on the site.
