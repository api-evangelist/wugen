openapi: 3.1.0
info:
  title: Wugen Legacy Content API (WordPress REST wp/v2)
  version: wp/v2
  summary: 'Public read surface of the retired wugen.com brand site: the 80-post press-release and scientific-publication
    archive, media library, taxonomies and site search.'
  description: 'wugen.com is the retired brand domain of Wugen, Inc., which renamed itself Allotera Therapeutics
    in July 2026. The human-facing site has been reduced to a single splash page that forwards visitors to alloteratx.com,
    but the underlying WordPress install is still live and still serves the full historical content archive over
    the WordPress REST API at https://wugen.com/wp-json/ — 80 posts spanning press releases (58), scientific publications
    (12), articles (8), careers, clinical and product-development items, plus 269 media objects and 11 category
    terms. The archive is therefore reachable by machine long after it stopped being reachable by navigation.


    This document was DERIVED mechanically by API Evangelist from the route-discovery document served at https://wugen.com/wp-json/
    on 2026-08-05 — every path, method and parameter below is taken verbatim from that descriptor, and only routes
    verified to return 200 to an anonymous request are included. Wugen publishes no OpenAPI definition of its own,
    and this is not a product API: it is the content API the CMS exposes. Note that wugen.com answers HTTP 200 with
    its splash page for every unmatched path (a soft 404), so path probes against this host must be diffed against
    a control path.'
  contact:
    name: Allotera Therapeutics (formerly Wugen)
    url: https://alloteratx.com/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://wugen.com/wp-json/
  x-derived-on: '2026-08-05'
  x-provider-published: false
servers:
- url: https://wugen.com/wp-json
  description: Production
