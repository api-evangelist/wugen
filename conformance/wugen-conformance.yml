method: derived
source: openapi/wugen-allotera-content-openapi.yml + live probes of both provider hosts
summary: >-
  Cross-cutting standards conformance for the only machine-readable surface Wugen/Allotera exposes,
  the WordPress REST wp/v2 content API. This is a derived assessment of observed behaviour. Allotera
  publishes no compliance program, no certifications and no conformance claims of its own, so no
  Compliance pointer is emitted for this provider.
standards:
- id: openapi-3.1
  conforms: true
  evidence: >-
    openapi/wugen-allotera-content-openapi.yml and openapi/wugen-legacy-content-openapi.yml are
    valid OpenAPI 3.1.0, derived by API Evangelist. The provider itself publishes no OpenAPI, and
    both documents carry x-provider-published: false.
- id: rest
  conforms: true
  evidence: Resource-oriented URIs, GET semantics, JSON representations, HTTP status codes.
- id: rfc8288-web-linking
  conforms: true
  evidence: >-
    Pagination is advertised via a Link header carrying rel="next" / rel="prev", observed on
    /wp/v2/posts.
- id: hal-style-hypermedia
  conforms: partial
  evidence: >-
    Every resource carries a _links object with self/collection/about/author/wp:term relations and
    an _embedded expansion via _embed. It is WordPress's own link format, not HAL, JSON:API or
    Siren.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use the WordPress envelope {code, message, data.status} served as application/json. No
    type URI, no title/detail members, no application/problem+json media type.
- id: json-api
  conforms: false
  evidence: No data/attributes/relationships document structure and no application/vnd.api+json.
- id: odata
  conforms: false
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 security scheme anywhere on the surface. /.well-known/oauth-authorization-server
    returns 404 on alloteratx.com and a soft 404 on wugen.com.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on alloteratx.com.
- id: rfc9116-security-txt
  conforms: false
  evidence: No /.well-known/security.txt on either host. See well-known/wugen-well-known.yml.
- id: rfc9727-api-catalog
  conforms: false
  evidence: No /.well-known/api-catalog on either host.
- id: rfc8594-sunset-header
  conforms: false
  evidence: >-
    No Sunset or Deprecation headers were observed, including on the retired wugen.com host whose
