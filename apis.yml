aid: wugen
name: Wugen
description: 'Wugen, Inc. is a St. Louis, Missouri clinical-stage cell-therapy company founded in
  2018 out of Washington University in St. Louis that develops off-the-shelf, allogeneic CAR-T and
  memory NK cell therapies for blood cancers, using CRISPR deletion of the T-cell receptor so cells
  from healthy donors can be given without graft-versus-host disease. In July 2026 the company
  renamed itself Allotera Therapeutics, Inc. and moved to alloteratx.com, closing a $35M financing
  that brought total capital raised to roughly $150M on top of its $115M Series C; its lead program,
  soficabtagene geleucel (sofi-cel, formerly WU-CART-007), is a CD7-targeted allogeneic CAR-T in a
  global pivotal study for relapsed or refractory T-cell acute lymphoblastic leukemia and T-cell
  lymphoblastic lymphoma, holds FDA Breakthrough Therapy designation, and was selected for the FDA
  CMC Development and Readiness Pilot Program. Wugen/Allotera publishes no product or developer API,
  no OpenAPI, no llms.txt and no agent card. The only machine-readable surface either domain exposes
  is the WordPress REST API (wp/v2), anonymously readable on both the current alloteratx.com site
  and the retired wugen.com brand domain, which still serves the complete historical press-release
  and scientific-publication archive as JSON even though its human-facing site is now a single
  splash page.'
